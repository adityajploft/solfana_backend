paths:

  /api/mobile/subscription/plans:
    get:
      tags:
        - Subscription
      summary: Get subscription plan list
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Subscription plans fetched successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: '../schemas/subscription.yaml#/SubscriptionPlan'

  /api/mobile/subscription/history:
    get:
      tags:
        - Subscription
      summary: Get subscription history
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Subscription history fetched successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: '../schemas/subscription.yaml#/SubscriptionHistory'