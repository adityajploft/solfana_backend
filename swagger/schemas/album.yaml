AlbumDetailsResponse:
  type: object

  properties:
    id:
      type: string
      format: uuid

    title:
      type: string

    description:
      type: string

    coverImage:
      type: string
      nullable: true

    type:
      type: string
      enum:
        - podcast
        - audiobook

    totalEpisodes:
      type: integer

    isFavourite:
      type: boolean

    createdAt:
      type: string
      format: date-time